[project]
name = "transcriptor-pro"
version = "3.0.0"
description = "Transcriptor de audio/video basado en Whisper y FFmpeg, con interfaz gráfica PySide6."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6,<7.0",
    "openai-whisper>=20231117",
    "torch>=2.0",
    "psutil>=5.9",
]

[project.scripts]
transcriptor-pro = "main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "gui*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_return_any = false

[tool.pylint.main]
disable = ["missing-module-docstring", "too-few-public-methods"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
